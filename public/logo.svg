<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <linearGradient id="beam" x1="10%" y1="0%" x2="90%" y2="100%">
            <stop offset="0%" stop-color="#FFC978"/>
            <stop offset="100%" stop-color="#FF9D3D"/>
        </linearGradient>
        <linearGradient id="stage" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1B1F29"/>
            <stop offset="100%" stop-color="#0A0C10"/>
        </linearGradient>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Stage: rounded square, not a generic circle -->
    <rect x="6" y="6" width="188" height="188" rx="44" fill="url(#stage)" stroke="rgba(255,157,61,0.25)" stroke-width="1.5"/>

    <!-- Play triangle fused with an "F": the flat edge is the stem,
         the notches read as both sprocket holes and the F's crossbars -->
    <g filter="url(#softGlow)">
        <path d="M70 54 L70 146 L146 100 Z" fill="url(#beam)"/>
    </g>

    <rect x="54" y="66" width="14" height="14" rx="4" fill="#0A0C10"/>
    <rect x="54" y="93" width="14" height="14" rx="4" fill="#0A0C10"/>
    <rect x="54" y="120" width="14" height="14" rx="4" fill="#0A0C10"/>

    <rect x="54" y="54" width="16" height="92" rx="6" fill="url(#beam)"/>
</svg>
